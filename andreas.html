<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andreas Lentz – Digitale Visitenkarte</title>
<meta name="description" content="Digitale Visitenkarte von Andreas Lentz, Malergeselle &amp; Vorarbeiter, Malereibetrieb Thorsten Lentz.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950: #150f20;
    --accent: #8b5cf6;
    --accent-2: #c084fc;
    --accent-3: #5b3a8a;
    --text-light: #f6f3fb;
    --text-muted: #b9aed0;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.09);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy-950);
    color: var(--text-light);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .brand-word { font-family: "Manrope", sans-serif; }

  .page {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  .glow-field { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .glow-field .sweep {
    position: absolute; top: -40%; left: -30%; width: 160%; height: 160%;
    background: conic-gradient(from 0deg, rgba(139,92,246,0.10), transparent 25%, transparent 75%, rgba(192,132,252,0.10));
  }
  .glow-field .blob-1 {
    position: absolute; top: -8%; left: -12%; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.34) 0%, rgba(139,92,246,0) 70%);
    filter: blur(6px);
  }
  .glow-field .blob-2 {
    position: absolute; bottom: -12%; right: -12%; width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(192,132,252,0.26) 0%, rgba(192,132,252,0) 70%);
    filter: blur(6px);
  }

  .card { position: relative; z-index: 1; width: 100%; max-width: 400px; text-align: center; }

  .brand-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 34px;
  }
  .brand-row img { width: 30px; height: 30px; border-radius: 8px; }
  .brand-word { font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; }
  .brand-sub {
    display: block; font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.58rem;
    letter-spacing: 0.16em; color: var(--text-muted); text-transform: uppercase; margin-top: 1px;
  }

  .photo-wrap {
    position: relative;
    margin: 0 auto 26px;
    width: 100%;
    max-width: 300px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--card-border), 0 30px 70px -20px rgba(139,92,246,0.45), 0 0 60px -10px rgba(139,92,246,0.35);
  }
  .photo-wrap img { width: 100%; height: auto; display: block; aspect-ratio: 4/5; object-fit: cover; }

  h1.name { font-size: 1.7rem; font-weight: 800; margin: 0 0 6px; }
  p.role { font-size: 0.98rem; color: var(--text-muted); margin: 0 0 26px; font-weight: 500; }

  .save-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 16px 34px -12px rgba(139,92,246,0.6);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-bottom: 30px;
  }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -12px rgba(139,92,246,0.75); }
  .save-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .icon-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 34px;
  }
  .icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--text-light); }
  .icon-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .icon-btn:hover .icon-circle { background: rgba(139,92,246,0.22); border-color: rgba(139,92,246,0.5); transform: translateY(-2px); }
  .icon-circle svg { width: 20px; height: 20px; color: var(--accent-2); }
  .icon-label { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); }

  .details {
    border-top: 1px solid var(--card-border);
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .details a, .details span {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .details a:hover { color: var(--accent-2); }
</style>
</head>
<body>

<script>

    var vcard = [

      'VERSION:3.0',
      'N:Lentz;Andreas;;;',
      'FN:Andreas Lentz',
      'ORG:Malereibetrieb Thorsten Lentz',
      'TITLE:Malergeselle & Vorarbeiter',

      'TEL;TYPE=CELL:+491749210845',
      'EMAIL;TYPE=WORK:info@wandgestaltung-lentz.de',
      'ADR;TYPE=WORK:;;Op de Hütt 8a;Norderstedt;;22851;Deutschland',
      'URL:https://msnexo.github.io/wandgestaltung-lentz/',
      'END:VCARD'
    ].join('\r\n');
    var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Andreas-Lentz.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });
</script>
